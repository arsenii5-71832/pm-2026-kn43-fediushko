<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 620" width="100%" height="100%">
  <defs>
    <style>
      .phone-bg { fill: #0F172A; stroke: #334155; stroke-width: 2; rx: 32px; }
      .notch { fill: #1E293B; rx: 10px; }
      .app-header { fill: #1E293B; }
      .card { fill: #1E293B; stroke: #334155; stroke-width: 1.5; rx: 12px; }
      .card-active { fill: #1E293B; stroke: #38BDF8; stroke-width: 2; rx: 12px; }
      .btn-primary { fill: #0284C7; rx: 8px; cursor: pointer; }
      .btn-secondary { fill: #334155; rx: 8px; }
      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
      .t-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #E2E8F0; }
      .t-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .t-btn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .badge-live { fill: #059669; rx: 4px; }
      .badge-warn { fill: #D97706; rx: 4px; }
      .badge-danger { fill: #DC2626; rx: 4px; }
    </style>
  </defs>

  <!-- Device Frame -->
  <rect x="10" y="10" width="360" height="600" class="phone-bg"/>
  <!-- Speaker Notch -->
  <rect x="130" y="20" width="120" height="18" class="notch"/>

  <!-- App Header -->
  <rect x="20" y="50" width="340" height="56" class="app-header" rx="10 10 0 0"/>
  <text x="36" y="74" class="t-title">S-03 Розклад на сьогодні</text>
  <text x="36" y="93" class="t-sub">Група КН-42 • Один погляд</text>

  <!-- Screen Content -->
  
  <!-- Header Bar -->
  <rect x="36" y="120" width="308" height="40" class="card"/>
  <text x="52" y="145" class="t-bold">Сьогодні: П'ятниця, 30 жовтня</text>
  <rect x="260" y="128" width="72" height="22" class="badge-live"/>
  <text x="296" y="143" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">3 ПАРИ</text>

  <!-- Pair 1 (Active) -->
  <rect x="36" y="174" width="308" height="96" class="card-active"/>
  <text x="50" y="198" class="t-sub">08:30 – 10:05 • 1 пара [Зараз іде]</text>
  <text x="50" y="222" class="t-title" font-size="14">Управління IT-проєктами</text>
  <text x="50" y="244" class="t-body">Ауд. 312 • Лекція • доц. Клименко В. О.</text>

  <!-- Pair 2 -->
  <rect x="36" y="282" width="308" height="90" class="card"/>
  <text x="50" y="306" class="t-sub">10:25 – 12:00 • 2 пара</text>
  <text x="50" y="328" class="t-title" font-size="14">Системний аналіз і проєктування</text>
  <text x="50" y="350" class="t-body">Ауд. 208 • Лабораторна • ст. викл. Савчук І. М.</text>

  <!-- Pair 3 -->
  <rect x="36" y="384" width="308" height="90" class="card"/>
  <text x="50" y="408" class="t-sub">12:20 – 13:55 • 3 пара</text>
  <text x="50" y="430" class="t-title" font-size="14">Безпека програмних систем</text>
  <text x="50" y="452" class="t-body">Ауд. 416 • Семінар • проф. Дмитрук Т. П.</text>

  <rect x="36" y="490" width="308" height="40" class="btn-secondary"/>
  <text x="190" y="515" class="t-btn">Дивитися розклад на завтра ➔</text>

</svg>