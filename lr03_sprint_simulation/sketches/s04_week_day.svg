<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 620" width="100%" height="100%">
  <defs>
    <style>
      .phone-bg { fill: #0F172A; stroke: #334155; stroke-width: 2; rx: 32px; }
      .notch { fill: #1E293B; rx: 10px; }
      .app-header { fill: #1E293B; }
      .card { fill: #1E293B; stroke: #334155; stroke-width: 1.5; rx: 12px; }
      .card-active { fill: #1E293B; stroke: #38BDF8; stroke-width: 2; rx: 12px; }
      .btn-primary { fill: #0284C7; rx: 8px; cursor: pointer; }
      .btn-secondary { fill: #334155; rx: 8px; }
      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
      .t-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #E2E8F0; }
      .t-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .t-btn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .badge-live { fill: #059669; rx: 4px; }
      .badge-warn { fill: #D97706; rx: 4px; }
      .badge-danger { fill: #DC2626; rx: 4px; }
    </style>
  </defs>

  <!-- Device Frame -->
  <rect x="10" y="10" width="360" height="600" class="phone-bg"/>
  <!-- Speaker Notch -->
  <rect x="130" y="20" width="120" height="18" class="notch"/>

  <!-- App Header -->
  <rect x="20" y="50" width="340" height="56" class="app-header" rx="10 10 0 0"/>
  <text x="36" y="74" class="t-title">S-04 Тиждень і день</text>
  <text x="36" y="93" class="t-sub">Два режими перегляду</text>

  <!-- Screen Content -->
  
  <!-- Dual Mode Tabs -->
  <rect x="36" y="118" width="150" height="34" class="btn-primary"/>
  <text x="111" y="140" class="t-btn">Тиждень (сітка)</text>
  <rect x="194" y="118" width="150" height="34" class="card-active"/>
  <text x="269" y="140" class="t-btn" fill="#38BDF8">День (картка)</text>

  <!-- Mode 1: Week Grid Mini -->
  <rect x="36" y="164" width="308" height="150" class="card"/>
  <text x="50" y="188" class="t-bold">[Режим 1] Тижнева сітка пар:</text>
  <text x="50" y="210" class="t-sub">ПН: 3 пари | ВТ: 4 пари | СР: 3 пари</text>
  <text x="50" y="230" class="t-sub">ЧТ: 4 пари | ПТ: 3 пари (сьогодні)</text>
  <rect x="48" y="246" width="284" height="28" rx="6" fill="#0284C7"/>
  <text x="190" y="265" class="t-btn" font-size="12">Клік на день для переходу в картку дня 👆</text>
  <text x="50" y="298" class="t-sub">Підсвічуються зміни пар і поточний день</text>

  <!-- Mode 2: Day Detail Card -->
  <rect x="36" y="328" width="308" height="170" class="card-active"/>
  <text x="50" y="352" class="t-bold">[Режим 2] Детальна картка: П'ятниця</text>
  <text x="50" y="374" class="t-body">• 08:30 Управління IT-проєктами (ауд. 312)</text>
  <text x="50" y="396" class="t-body">• 10:25 Системний аналіз (ауд. 208)</text>
  <text x="50" y="418" class="t-body">• 12:20 Безпека ПЗ (ауд. 416)</text>
  <text x="50" y="446" class="t-sub">Перехід між тижнем і днем без перезавантаження</text>

  <rect x="36" y="512" width="308" height="38" class="btn-secondary"/>
  <text x="190" y="536" class="t-btn">Повернутися до загального тижня</text>

</svg>