<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 620" width="100%" height="100%">
  <defs>
    <style>
      .phone-bg { fill: #0F172A; stroke: #334155; stroke-width: 2; rx: 32px; }
      .notch { fill: #1E293B; rx: 10px; }
      .app-header { fill: #1E293B; }
      .card { fill: #1E293B; stroke: #334155; stroke-width: 1.5; rx: 12px; }
      .card-active { fill: #1E293B; stroke: #38BDF8; stroke-width: 2; rx: 12px; }
      .btn-primary { fill: #0284C7; rx: 8px; cursor: pointer; }
      .btn-secondary { fill: #334155; rx: 8px; }
      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
      .t-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #E2E8F0; }
      .t-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .t-btn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .badge-live { fill: #059669; rx: 4px; }
      .badge-warn { fill: #D97706; rx: 4px; }
      .badge-danger { fill: #DC2626; rx: 4px; }
    </style>
  </defs>

  <!-- Device Frame -->
  <rect x="10" y="10" width="360" height="600" class="phone-bg"/>
  <!-- Speaker Notch -->
  <rect x="130" y="20" width="120" height="18" class="notch"/>

  <!-- App Header -->
  <rect x="20" y="50" width="340" height="56" class="app-header" rx="10 10 0 0"/>
  <text x="36" y="74" class="t-title">S-06 Сповіщення про зміни</text>
  <text x="36" y="93" class="t-sub">Push-сповіщення та банер пари</text>

  <!-- Screen Content -->
  
  <!-- System Push Notification -->
  <rect x="30" y="120" width="320" height="110" class="card" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="56" cy="148" r="14" fill="#D97706"/>
  <text x="56" y="153" font-size="14" text-anchor="middle" fill="#fff">⚠️</text>
  <text x="80" y="144" class="t-bold" fill="#FBBF24">Увага: Зміна в розкладі на сьогодні!</text>
  <text x="80" y="164" class="t-body">Пару з «Системного аналізу» (10:25)</text>
  <text x="80" y="184" class="t-body">перенесено в <tspan fill="#38BDF8">ауд. 104 (дистанційно у Zoom)</tspan></text>
  <text x="80" y="208" class="t-sub">Сповіщення надійшло за 45 хв до початку</text>

  <!-- In-app schedule update banner -->
  <rect x="36" y="248" width="308" height="130" class="card"/>
  <text x="52" y="274" class="t-bold">Картка зміненої пари в застосунку:</text>
  <rect x="52" y="286" width="90" height="20" class="badge-warn"/>
  <text x="97" y="300" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">ПЕРЕНЕСЕНО</text>
  <text x="52" y="328" class="t-body">10:25 – 12:00 • 2 пара</text>
  <text x="52" y="348" class="t-sub">Аудиторія: Zoom (посилання додано в картку)</text>

  <!-- Action button -->
  <rect x="36" y="396" width="308" height="44" class="btn-primary"/>
  <text x="190" y="423" class="t-btn">Приєднатися до заняття ➔</text>

</svg>