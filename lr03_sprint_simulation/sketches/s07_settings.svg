<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 620" width="100%" height="100%">
  <defs>
    <style>
      .phone-bg { fill: #0F172A; stroke: #334155; stroke-width: 2; rx: 32px; }
      .notch { fill: #1E293B; rx: 10px; }
      .app-header { fill: #1E293B; }
      .card { fill: #1E293B; stroke: #334155; stroke-width: 1.5; rx: 12px; }
      .card-active { fill: #1E293B; stroke: #38BDF8; stroke-width: 2; rx: 12px; }
      .btn-primary { fill: #0284C7; rx: 8px; cursor: pointer; }
      .btn-secondary { fill: #334155; rx: 8px; }
      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
      .t-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #E2E8F0; }
      .t-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .t-btn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .badge-live { fill: #059669; rx: 4px; }
      .badge-warn { fill: #D97706; rx: 4px; }
      .badge-danger { fill: #DC2626; rx: 4px; }
    </style>
  </defs>

  <!-- Device Frame -->
  <rect x="10" y="10" width="360" height="600" class="phone-bg"/>
  <!-- Speaker Notch -->
  <rect x="130" y="20" width="120" height="18" class="notch"/>

  <!-- App Header -->
  <rect x="20" y="50" width="340" height="56" class="app-header" rx="10 10 0 0"/>
  <text x="36" y="74" class="t-title">S-07 Налаштування пушів</text>
  <text x="36" y="93" class="t-sub">Фільтри та години тиші</text>

  <!-- Screen Content -->
  
  <text x="36" y="126" class="t-title">Налаштування сповіщень</text>
  <text x="36" y="146" class="t-sub">Керуйте типами повідомлень та розкладом тиші</text>

  <!-- Toggle 1 -->
  <rect x="36" y="168" width="308" height="64" class="card"/>
  <text x="52" y="194" class="t-bold">Тільки моя група (КН-42)</text>
  <text x="52" y="214" class="t-sub">Ігнорувати сповіщення інших потоків</text>
  <rect x="290" y="184" width="40" height="22" rx="11" fill="#0284C7"/>
  <circle cx="320" cy="195" r="8" fill="#fff"/>

  <!-- Toggle 2 -->
  <rect x="36" y="244" width="308" height="64" class="card"/>
  <text x="52" y="270" class="t-bold">Нічний режим (22:00 – 07:00)</text>
  <text x="52" y="290" class="t-sub">Без звукових сигналів уночі</text>
  <rect x="290" y="260" width="40" height="22" rx="11" fill="#0284C7"/>
  <circle cx="320" cy="271" r="8" fill="#fff"/>

  <!-- Toggle 3 -->
  <rect x="36" y="320" width="308" height="64" class="card"/>
  <text x="52" y="346" class="t-bold">Зміна аудиторії або викладача</text>
  <text x="52" y="366" class="t-sub">Миттєвий пріоритетний push</text>
  <rect x="290" y="336" width="40" height="22" rx="11" fill="#0284C7"/>
  <circle cx="320" cy="347" r="8" fill="#fff"/>

  <rect x="36" y="408" width="308" height="44" class="btn-primary"/>
  <text x="190" y="435" class="t-btn">Зберегти налаштування</text>

  <text x="36" y="482" class="t-sub">✅ Налаштування збережено локально та на сервері сповіщень</text>

</svg>