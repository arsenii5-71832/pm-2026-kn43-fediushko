<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0e1621; }
      .header-bg { fill: #17212b; }
      .card-bg { fill: #182533; stroke: #242f3d; stroke-width: 1.5; rx: 8px; }
      .bot-bubble { fill: #182533; stroke: #2b5278; stroke-width: 1; rx: 10px; }
      .user-bubble { fill: #2b5278; stroke: #4075a6; stroke-width: 1; rx: 10px; }
      .btn { fill: #242f3d; stroke: #2b5278; stroke-width: 1.5; rx: 6px; cursor: pointer; }
      .btn-primary { fill: #2b5278; stroke: #5288c1; stroke-width: 1.5; rx: 6px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #ffffff; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #7f91a4; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #f5f5f5; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #7f91a4; }
      .text-btn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #64b5f6; text-anchor: middle; }
      .text-btn-w { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #ffffff; text-anchor: middle; }
      .badge { fill: #2f6ea5; rx: 4px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #ffffff; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="640" height="420" class="bg" rx="10"/>

  <!-- Top App Header -->
  <rect width="640" height="48" class="header-bg" rx="10 10 0 0"/>
  <circle cx="28" cy="24" r="16" fill="#242f3d"/>
  <text x="28" y="29" font-family="sans-serif" font-size="14" fill="#64b5f6" text-anchor="middle">🏛️</text>
  <text x="56" y="22" class="text-title">Деканат-Бот | S-05 Повідомлення про готовність довідки</text>
  <text x="56" y="38" class="text-sub">bot • Push Alert & Download Attachment</text>

  <!-- Telegram Chat Area -->
  
  <!-- Telegram Push Notification Card -->
  <rect x="24" y="66" width="572" height="150" class="bot-bubble" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="56" cy="100" r="18" fill="#1b5e20"/>
  <text x="56" y="106" font-size="18" text-anchor="middle">🔔</text>
  
  <text x="90" y="96" class="text-title" fill="#81c784">Ваша довідка готова до видачі!</text>
  <text x="90" y="118" class="text-body">Довідка: <tspan fill="#64b5f6">№ DOC-2026-104 (про навчання за місцем вимоги)</tspan></text>
  <text x="90" y="138" class="text-body">Підписано КЕП декана: 30.10.2026 о 15:30</text>
  <text x="90" y="158" class="text-sub">Оригінал з печаткою доступний у каб. 214 (пн-пт 10:00 - 16:00)</text>

  <!-- Action Buttons inside notification -->
  <rect x="40" y="172" width="250" height="32" class="btn-primary"/>
  <text x="165" y="193" class="text-btn-w">📥 Завантажити PDF з КЕП</text>

  <rect x="306" y="172" width="270" height="32" class="btn"/>
  <text x="441" y="193" class="text-btn">🕒 Записатися в чергу на видачу</text>

  <!-- Step 2: Confirmation / Ack -->
  <rect x="24" y="234" width="420" height="50" class="bot-bubble"/>
  <text x="38" y="264" class="text-body">Документ перенесено до архіву закритих замовлень.</text>

</svg>