<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0e1621; }
      .header-bg { fill: #17212b; }
      .card-bg { fill: #182533; stroke: #242f3d; stroke-width: 1.5; rx: 8px; }
      .bot-bubble { fill: #182533; stroke: #2b5278; stroke-width: 1; rx: 10px; }
      .user-bubble { fill: #2b5278; stroke: #4075a6; stroke-width: 1; rx: 10px; }
      .btn { fill: #242f3d; stroke: #2b5278; stroke-width: 1.5; rx: 6px; cursor: pointer; }
      .btn-primary { fill: #2b5278; stroke: #5288c1; stroke-width: 1.5; rx: 6px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #ffffff; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #7f91a4; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #f5f5f5; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #7f91a4; }
      .text-btn { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #64b5f6; text-anchor: middle; }
      .text-btn-w { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #ffffff; text-anchor: middle; }
      .badge { fill: #2f6ea5; rx: 4px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #ffffff; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="640" height="420" class="bg" rx="10"/>

  <!-- Top App Header -->
  <rect width="640" height="48" class="header-bg" rx="10 10 0 0"/>
  <circle cx="28" cy="24" r="16" fill="#242f3d"/>
  <text x="28" y="29" font-family="sans-serif" font-size="14" fill="#64b5f6" text-anchor="middle">🏛️</text>
  <text x="56" y="22" class="text-title">Деканат-Бот | S-04 Замовлення і стан в одному діалозі</text>
  <text x="56" y="38" class="text-sub">bot • Dual mode: Create & Status Tracking</text>

  <!-- Telegram Chat Area -->
  
  <!-- Dual Tab Switcher -->
  <rect x="24" y="62" width="280" height="34" class="btn-primary"/>
  <text x="164" y="84" class="text-btn-w">📝 [Режим 1] Нове замовлення</text>

  <rect x="314" y="62" width="280" height="34" class="btn" stroke="#64b5f6"/>
  <text x="454" y="84" class="text-btn">📊 [Режим 2] Мої заявки (2)</text>

  <!-- Screen Split / Mode Display -->
  <rect x="24" y="108" width="572" height="236" class="bot-bubble"/>
  
  <text x="40" y="134" class="text-title">📋 Стан поточних замовлень користувача:</text>
  
  <!-- Item 1 -->
  <rect x="40" y="150" width="540" height="52" class="card-bg"/>
  <text x="56" y="172" class="text-body">#DOC-2026-104 • Довідка про навчання (ТЦК)</text>
  <text x="56" y="190" class="text-sub">Подано: 28.10.2026 14:10 | Очікуваний термін: 2 робочі дні</text>
  <rect x="440" y="162" width="124" height="22" class="badge" fill="#f57c00"/>
  <text x="502" y="177" class="badge-text" text-anchor="middle">⏳ В ОБРОБЦІ</text>

  <!-- Item 2 -->
  <rect x="40" y="214" width="540" height="52" class="card-bg"/>
  <text x="56" y="236" class="text-body">#DOC-2026-089 • Витяг оцінок за 7 семестр</text>
  <text x="56" y="254" class="text-sub">Подано: 20.10.2026 10:30 | Забрати: к. 214</text>
  <rect x="440" y="226" width="124" height="22" class="badge" fill="#2e7d32"/>
  <text x="502" y="241" class="badge-text" text-anchor="middle">✅ ГОТОВО (PDF)</text>

  <!-- Action to switch or add -->
  <text x="40" y="322" class="text-muted">Потрібна інша довідка? Натисніть «Нове замовлення» для миттєвого переходу.</text>
  
  <rect x="24" y="356" width="572" height="36" class="btn"/>
  <text x="310" y="378" class="text-btn">🔄 Оновити стан замовлень</text>

</svg>